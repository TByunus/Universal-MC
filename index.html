    <script>
        (function () {
            var formatter = new Intl.DateTimeFormat('tr-TR', {
                day: '2-digit',
                month: 'long',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            window.updateHeaderClock = function () {
                var el = document.getElementById('header-clock');
                if (!el) return;
                el.textContent = formatter.format(new Date());
            };
            window.startHeaderClock = function () {
                if (window.__headerClockTimer) {
                    clearInterval(window.__headerClockTimer);
                }
                window.updateHeaderClock();
                window.__headerClockTimer = setInterval(window.updateHeaderClock, 60000);
            };
        })();
    </script>
